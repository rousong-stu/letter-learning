<!DOCTYPE html>
<html lang="zh-cmn-Hans">
  <head>
    <meta charset="utf-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="webkit" name="renderer" />
    <meta
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
      name="viewport"
    />
    <link href="<%= BASE_URL %>letterlearning_favicon_final.ico" rel="icon" />
    <title><%= VUE_APP_TITLE %></title>
    <meta
      content="lumilyx英语学习平台,英语学习,词汇学习,AI词汇短文"
      name="keywords"
    />
    <meta content="<%= VUE_APP_AUTHOR %>" name="author" />
    <link
      href="<%= BASE_URL %>static/css/loading.css?random=<%= VUE_APP_RANDOM %>"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript></noscript>
    <div id="app">
      <div class="first-loading-wrp">
        <div class="lottie-container">
          <lottie-player
            src="https://assets10.lottiefiles.com/packages/lf20_usmfx6bp.json"
            background="transparent"
            speed="1"
            loop
            autoplay
            style="width: 180px; height: 180px"
          >
          </lottie-player>
          <p class="lottie-desc">欢迎选择Lumilyx，智慧学习即刻开始！</p>
        </div>
      </div>
    </div>

    <script>
      const lottieScript = document.createElement('script')
      lottieScript.setAttribute('src', 'https://unpkg.com/@lottiefiles/lottie-player@2.0.12/dist/lottie-player.js')
      lottieScript.setAttribute('defer', 'defer')
      document.head.appendChild(lottieScript)
  </script>
  </body>
</html>
